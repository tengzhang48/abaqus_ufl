# License-free CI: everything here runs without Abaqus. The Abaqus-side
# smoke runs (actual UMAT/UEL jobs) are a documented manual gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Install package (dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run test suite (includes example verification bundles)
        run: python -m pytest tests -q

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Regenerate every example and require a clean tree
        run: |
          for d in examples/*/; do
            [ -f "$d/build.py" ] || continue
            (cd "$d" && python build.py)
          done
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check sdist contents include tests, docs, and examples
        run: |
          tar -tzf dist/*.tar.gz | grep -q "tests/test_umat_gen.py"
          tar -tzf dist/*.tar.gz | grep -q "CITATION.cff"
          tar -tzf dist/*.tar.gz | grep -q "examples/neo_hookean_umat/check_reference.py"
