name: Livebench and website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('abaqus-ufl-pages-pr-{0}', github.event.pull_request.number) || 'abaqus-ufl-pages-production' }}
  cancel-in-progress: true

jobs:
  livebench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Install package and build tools
        run: python -m pip install -e ".[dev]"
      - name: Run boundary-value simulations and verification checks through f2py
        run: python tools/run_livebench.py
      - name: Retain report and logs, including numerical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-results
          path: benchmark-results/
          if-no-files-found: error

  build:
    needs: livebench
    if: ${{ !cancelled() && (needs.livebench.result == 'success' || needs.livebench.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VITE_BASE_PATH: /abaqus_ufl/
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked website dependencies
        run: npm ci

      - name: Use this run's benchmark report and logs
        uses: actions/download-artifact@v4
        with:
          name: livebench-results
          path: web/public/livebench

      - name: Require a complete benchmark report
        run: node scripts/check-livebench.mjs

      - name: Check source evidence, types, tests, and production build
        run: npm run check

      - name: Configure GitHub Pages
        if: github.repository == 'tengzhang48/abaqus_ufl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        if: github.repository == 'tengzhang48/abaqus_ufl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Retain website preview for pull requests and forks
        if: github.event_name == 'pull_request' || github.repository != 'tengzhang48/abaqus_ufl'
        uses: actions/upload-artifact@v4
        with:
          name: livebench-website-preview
          path: web/dist

  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.repository == 'tengzhang48/abaqus_ufl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
